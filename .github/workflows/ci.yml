name: Argus CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Validate Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/app/package-lock.json

      - name: Install dependencies (apps/web)
        working-directory: apps/web
        run: npm ci

      - name: Build Astro Frontend (apps/web)
        working-directory: apps/web
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Test web routing and uploads
        working-directory: apps/web
        run: npm test

      - name: Install dependencies (apps/app)
        working-directory: apps/app
        run: npm ci

      - name: Lint and Typecheck (apps/app)
        working-directory: apps/app
        env:
          SKIP_ENV_VALIDATION: '1'
        run: npm run check

      - name: Test app authorization and guardrails
        working-directory: apps/app
        run: npm test

      - name: Build Next.js application
        working-directory: apps/app
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          AUTH_SECRET: ci-only-not-a-production-secret-00000000
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/argus
        run: npm run build
